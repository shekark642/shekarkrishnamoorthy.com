<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Page Not Found — Shekar Krishnamoorthy</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<style>
  :root {
    --bg: #f8fafc;
    --card: #ffffff;
    --text: #0f172a;
    --muted: #475569;
    --accent: #0284c7;
    --accent2: #db2777;
    --border: #dbe3ee;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
  }
  main {
    text-align: center;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 3rem 2.5rem;
    max-width: 420px;
  }
  .code {
    font-size: 4rem;
    font-weight: 700;
    margin: 0;
    color: var(--accent);
  }
  .code .dot { color: var(--accent2); }
  h1 {
    margin: 0.5rem 0 0.75rem;
    font-size: 1.4rem;
  }
  p {
    margin: 0 0 1.5rem;
    color: var(--muted);
  }
  a {
    display: inline-block;
    background: var(--accent);
    color: #ffffff;
    text-decoration: none;
    font-weight: 600;
    font-size: 0.9rem;
    padding: 0.6rem 1.2rem;
    border-radius: 8px;
  }
  a:hover { background: #0369a1; }
</style>
</head>
<body>
<main>
  <p class="code">404<span class="dot">.</span></p>
  <h1>Page not found</h1>
  <p>The page you're looking for doesn't exist, was moved, or never existed in the first place.</p>
  <a href="/">Back to home</a>
</main>
</body>
</html>
