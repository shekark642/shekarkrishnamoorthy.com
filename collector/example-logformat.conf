# example-logformat.conf — Apache custom log format examples
# HW3 Module 03: Server-Log Collection
#
# This is a reference file, not live server config. The Client Hints +
# extended LogFormat pattern shown below is NOT hypothetical for this
# project - it's already deployed and verified live on
# test.shekarkrishnamoorthy.com (set up during the "enhanced logs" task,
# see /etc/apache2/conf-available/client-hints-logging.conf on the server).

# --- Standard Combined Log Format (Apache's own default) ---
LogFormat "%h %l %u %t \"%r\" %>s %b \"%{Referer}i\" \"%{User-Agent}i\"" combined

# --- Extended format for analytics: adds response time + a session cookie ---
LogFormat "%h %t \"%r\" %>s %b %D \"%{Referer}i\" \"%{User-Agent}i\" \"%{Accept-Language}i\" \"%{_session}C\"" analytics

# --- Client Hints capture (the actual format live on test.shekarkrishnamoorthy.com) ---
# Full version deployed adds 14 Client Hints fields; here's the shape:
LogFormat "%h %t \"%r\" %>s \"%{Sec-CH-UA}i\" \"%{Sec-CH-UA-Platform}i\" \"%{Sec-CH-Viewport-Width}i\" \"%{Sec-CH-Prefers-Color-Scheme}i\"" hints

# To actually opt browsers into sending those Client Hints headers, the
# server must ALSO send this response header (requires mod_headers):
#   Header set Accept-CH "Sec-CH-UA, Sec-CH-UA-Platform, Sec-CH-Viewport-Width, Sec-CH-Prefers-Color-Scheme"
# See the live config on test.shekarkrishnamoorthy.com for the full working
# version (13 hints, plus Vary appended so caches don't mix responses).

# --- Applying a format to a vhost's log ---
CustomLog /var/log/apache2/analytics.log analytics

# --- Nginx equivalent, for reference (this server runs Apache, not Nginx) ---
