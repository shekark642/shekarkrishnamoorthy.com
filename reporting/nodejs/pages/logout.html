<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Logged Out — Analytics Dashboard</title>
<link rel="icon" type="image/svg+xml" href="https://shekarkrishnamoorthy.com/favicon.svg">
<style>
  body {
    margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
    font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif; background: #f8fafc; color: #0f172a;
  }
  .card { background: #fff; border: 1px solid #dbe3ee; border-radius: 16px; padding: 2.5rem; width: 100%; max-width: 380px; text-align: center; }
  h1 { font-size: 1.3rem; margin: 0.5rem 0; }
  p { color: #64748b; font-size: 0.9rem; margin: 0 0 1.5rem; }
  a.btn { display: inline-block; border-radius: 8px; padding: 0.6rem 1.2rem; background: #0284c7; color: #fff; font-weight: 600; text-decoration: none; font-size: 0.9rem; }
  a.btn:hover { background: #0369a1; }
  .check { font-size: 2.5rem; }
</style>
</head>
<body>
<div class="card">
  <div class="check">&#10003;</div>
  <h1>You have successfully logged out</h1>
  <p>Your session has been ended. You'll need to log in again to view the dashboard.</p>
  <a class="btn" href="/login.html">Back to Login</a>
</div>
</body>
</html>
