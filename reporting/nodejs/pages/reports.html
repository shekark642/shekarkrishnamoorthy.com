<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reports — Analytics Dashboard</title>
<link rel="icon" type="image/svg+xml" href="https://shekarkrishnamoorthy.com/favicon.svg">
<style>
  body { font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif; background: #f8fafc; color: #0f172a; margin: 0; padding: 2rem 1.5rem 4rem; }
  main { max-width: 980px; margin: 0 auto; }
  header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem; flex-wrap: wrap; gap: 0.6rem; }
  header h1 { font-size: 1.3rem; margin: 0; }
  nav a { color: #0284c7; text-decoration: none; font-size: 0.88rem; margin-left: 1rem; font-weight: 600; }
  .card { background: #fff; border: 1px solid #dbe3ee; border-radius: 16px; padding: 1.5rem 1.75rem; margin-bottom: 1.5rem; }
  .card h2 { font-size: 1rem; margin: 0 0 0.4rem; }
  .card > p.hint { color: #64748b; font-size: 0.82rem; margin: 0 0 1rem; }

  .table-wrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
  th, td { text-align: left; padding: 0.6rem 0.7rem; border-bottom: 1px solid #eef2f7; vertical-align: top; }
  th { color: #475569; font-weight: 600; }
  .tag { display: inline-block; background: #f1f5f9; color: #334155; border-radius: 6px; padding: 0.1rem 0.5rem; font-size: 0.74rem; }
  .notes { color: #64748b; max-width: 260px; white-space: pre-wrap; }
  .btn { display: inline-block; border: none; border-radius: 7px; padding: 0.4rem 0.8rem; background: #0284c7; color: #fff; font-weight: 600; text-decoration: none; font-size: 0.8rem; cursor: pointer; }
  .btn:hover { background: #0369a1; }
  .btn-delete { background: #fee2e2; color: #b91c1c; border: none; border-radius: 6px; padding: 0.35rem 0.7rem; font-size: 0.78rem; font-weight: 600; cursor: pointer; margin-left: 0.4rem; }
  .actions { white-space: nowrap; }
  .empty { color: #94a3b8; font-size: 0.85rem; font-style: italic; }
</style>
</head>
<body>
<main>
  <header>
    <h1>Reports</h1>
    <nav id="mainNav">
      <a href="/index.html">&larr; Dashboard</a>
      <a href="#" id="logoutLink">Log out</a>
    </nav>
  </header>

  <div class="card">
    <h2>Saved Reports</h2>
    <p class="hint">Generated from each metrics page's own "Generate Report" button - a snapshot PDF, with any markup and notes added at the time.</p>
    <div class="table-wrap" id="reportsWrap"><p class="empty">Loading...</p></div>
  </div>
</main>

<script>
(function () {
  "use strict";
  var me = null;

  var PAGE_LABELS = {
    dashboard: "Dashboard",
    performance: "Performance",
    music: "Music Site Metrics",
    "about-me": "About Me Metrics",
    projects: "Projects Metrics"
  };

  function esc(s) { return String(s).replace(/</g, "&lt;"); }
  function fmtDate(s) {
    var d = new Date(s);
    if (isNaN(d.getTime())) return "—";
    return d.toLocaleString(undefined, { month: "short", day: "numeric", year: "numeric", hour: "numeric", minute: "2-digit" });
  }

  function canDelete(r) {
    if (!me) return false;
    if (me.role === "super_admin") return true;
    if (me.role !== "analyst") return false;
    return r.createdBy === me.username;
  }

  function loadReports() {
    fetch("/api/reports").then(function (r) { return r.json(); }).then(function (rows) {
      var wrap = document.getElementById("reportsWrap");
      if (!rows.length) {
        wrap.innerHTML = '<p class="empty">No saved reports yet.</p>';
        return;
      }
      var head = "<tr><th>Name</th><th>Page</th><th>Notes</th><th>Created By</th><th>Created At</th><th></th></tr>";
      var body = rows.map(function (r) {
        return "<tr>" +
          "<td>" + esc(r.name) + "</td>" +
          "<td><span class='tag'>" + esc(PAGE_LABELS[r.sourcePage] || r.sourcePage) + "</span></td>" +
          "<td class='notes'>" + esc(r.notes || "") + "</td>" +
          "<td>" + esc(r.createdBy) + "</td>" +
          "<td>" + fmtDate(r.createdAt) + "</td>" +
          "<td class='actions'>" +
            "<a class='btn' href='/api/reports/" + r.id + "/file' target='_blank' rel='noopener'>View PDF</a>" +
            (canDelete(r) ? "<button class='btn-delete' data-delete='" + r.id + "'>Delete</button>" : "") +
          "</td>" +
        "</tr>";
      }).join("");
      wrap.innerHTML = "<table><thead>" + head + "</thead><tbody>" + body + "</tbody></table>";

      Array.prototype.forEach.call(wrap.querySelectorAll("[data-delete]"), function (btn) {
        btn.addEventListener("click", function () {
          if (!window.confirm("Delete this report? This cannot be undone.")) return;
          fetch("/api/reports/" + btn.dataset.delete, { method: "DELETE" }).then(function (r) {
            if (r.status === 204) { loadReports(); return; }
            return r.json().then(function (body) { window.alert(body.error || "Delete failed."); });
          });
        });
      });
    });
  }

  fetch("/auth/me").then(function (r) { return r.json(); }).then(function (data) {
    me = data;
    var nav = document.getElementById("mainNav");
    var links = '<a href="/index.html">&larr; Dashboard</a>';
    if (me.role === "super_admin") links += '<a href="/users.html">User Management</a>';
    nav.innerHTML = links + '<a href="#" id="logoutLink">Log out</a>';
    document.getElementById("logoutLink").addEventListener("click", function (e) {
      e.preventDefault();
      fetch("/auth/logout", { method: "POST" }).then(function () { window.location.href = "/logout.html"; });
    });
    loadReports();
  });
})();
</script>
</body>
</html>
