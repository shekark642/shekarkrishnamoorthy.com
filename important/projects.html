<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Projects — Shekar Krishnamoorthy</title>
<link rel="icon" type="image/svg+xml" href="https://shekarkrishnamoorthy.com/favicon.svg">
<link rel="stylesheet" href="/assets/site-nav.css">
<style>
  main { max-width: 1000px; margin: 0 auto; padding: 2.5rem 1.5rem 4rem; }

  .project-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 1.25rem;
    margin-top: 1.5rem;
  }
  @media (max-width: 560px) {
    .project-grid { grid-template-columns: 1fr; }
  }

  .project-card {
    display: block;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
    overflow: hidden;
    text-decoration: none;
    color: inherit;
    box-shadow: 0 1px 2px rgba(15, 23, 42, 0.04), 0 4px 12px rgba(15, 23, 42, 0.05);
    transition: transform 0.15s ease, box-shadow 0.15s ease;
  }
  .project-card:hover {
    transform: translateY(-2px);
    box-shadow: 0 2px 4px rgba(15, 23, 42, 0.06), 0 8px 20px rgba(15, 23, 42, 0.08);
  }

  .project-thumb {
    position: relative;
    aspect-ratio: 16 / 9;
    background: var(--bg);
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--muted);
    font-size: 0.8rem;
  }
  .project-thumb img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }
  .broken-badge {
    position: absolute;
    top: 8px;
    right: 8px;
    width: 30px;
    height: 30px;
    border-radius: 50%;
    background: #dc2626;
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1rem;
    font-weight: 700;
    box-shadow: 0 2px 6px rgba(0, 0, 0, 0.25);
  }

  .project-info { padding: 0.9rem 1rem 1.1rem; }
  .project-info h3 { margin: 0 0 0.2rem; font-size: 1rem; }
  .project-year {
    margin: 0 0 0.5rem;
    font-size: 0.72rem;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--accent);
  }
  .project-desc { margin: 0; font-size: 0.85rem; color: var(--muted); }

  .project-controls {
    display: flex;
    align-items: center;
    gap: 0.6rem;
    margin-top: 1.5rem;
  }
  .project-controls label {
    font-size: 0.85rem;
    color: var(--muted);
  }
  .project-controls select {
    font: inherit;
    font-size: 0.85rem;
    font-weight: 600;
    color: var(--text);
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 0.4rem 0.7rem;
  }
</style>
</head>
<body>

<header class="site-header">
  <img class="site-favicon" src="https://shekarkrishnamoorthy.com/favicon.svg" alt="" width="28" height="28">
  <div class="site-header-inner">
    <nav aria-label="Primary">
      <a href="https://shekarkrishnamoorthy.com/">Home</a>
      <a class="active" href="https://shekarkrishnamoorthy.com/important/projects.html">Projects</a>
      <a href="https://test.shekarkrishnamoorthy.com/">Music</a>
      <a href="https://reporting.shekarkrishnamoorthy.com/">Reporting</a>
    </nav>
  </div>
</header>

<main>
  <div class="page-intro">
    <h1>Projects</h1>
    <p>A growing list of things built for this site, including the homework log.</p>
  </div>

  <div class="project-controls">
    <label for="sortSelect">Sort by</label>
    <select id="sortSelect">
      <option value="newest">Newest to Oldest</option>
      <option value="coolest">Coolest to Lamest</option>
    </select>
  </div>

  <div class="project-grid" id="projectGrid"></div>
</main>

<script>
  // Skeleton project data - each real project becomes one object here.
  // year: numeric, used by the "Newest to Oldest" sort.
  // coolness: 1-10, used by the "Coolest to Lamest" sort - purely a personal
  //   ranking you set per project, unrelated to year.
  // image: leave "" for a placeholder box until a real thumbnail exists.
  // url: leave "#" until the project has a real link.
  const projects = [
    { title: "Homework Log", year: 2026, coolness: 5, image: "", desc: "Assignments completed for this site, with links and short descriptions.", url: "https://shekarkrishnamoorthy.com/homework.html" },
    { title: "Analysis of Cardiovascular and Respiratory Health", year: 2025, coolness: 8, image: "https://shekark642.github.io/portfolio/projects/images/cardio_and_resp_analysis_ss.png", desc: "A data science course project: an interactive site that lets users compare themselves to similar athletes to set a baseline for improvement.", url: "https://shekark642.github.io/final106/" },
    { title: "Bikewatching in Boston", year: 2025, coolness: 9, image: "https://shekark642.github.io/portfolio/projects/images/bikewatching_project_ss.png", desc: "An interactive map analyzing bike lane and station traffic/flow across Boston at different times of day.", url: "https://shekark642.github.io/BostonBikeTraffic/" },
    { title: "ATP Sports Analytics Pipeline", year: 2025, coolness: 10, image: "images/atp-thumb.png", desc: "A PyTorch model using historical match data and LLM-generated player tags to predict professional tennis match outcomes against bookmaker odds.", url: "https://colab.research.google.com/drive/1hOR4hbYbc6bKKdUQ08g_rUv6CZI9pTa5#scrollTo=1FROmf5Waz_Y" },
    { title: "Top Headlines", year: 2026, coolness: 7, image: "images/news-thumb.png", broken: true, desc: "A live news reader pulling top headlines from NewsAPI, filterable by category and sortable by popularity or date.", url: "https://shekarkrishnamoorthy.com/important/news.html" },
    { title: "Project 6", year: 2021, coolness: 7, image: "", desc: "Description coming soon.", url: "#" },
    { title: "Project 7", year: 2020, coolness: 4, image: "", desc: "Description coming soon.", url: "#" },
    { title: "Project 8", year: 2019, coolness: 8, image: "", desc: "Description coming soon.", url: "#" },
  ];

  const grid = document.getElementById("projectGrid");
  const sortSelect = document.getElementById("sortSelect");

  function render(sortBy) {
    const sorted = [...projects].sort((a, b) =>
      sortBy === "coolest" ? b.coolness - a.coolness : b.year - a.year
    );
    grid.innerHTML = sorted.map(p => `
      <a class="project-card" href="${p.url}">
        <div class="project-thumb">${p.image ? `<img src="${p.image}" alt="">` : "Image"}${p.broken ? `<span class="broken-badge" title="Currently broken">&#10005;</span>` : ""}</div>
        <div class="project-info">
          <h3>${p.title}</h3>
          <p class="project-year">${p.year || "TBD"}</p>
          <p class="project-desc">${p.desc}</p>
        </div>
      </a>
    `).join("");
  }

  sortSelect.addEventListener("change", () => render(sortSelect.value));
  render(sortSelect.value);
</script>

</body>
</html>
